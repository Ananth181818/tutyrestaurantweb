<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sathish | Portfolio</title>
  <link rel="stylesheet" href="../../bootstrap-5.3.8-dist/css/bootstrap.min.css" />
  <script src="../../jquery-3.7.1.min.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #0d1117;
      color: white;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== Side Panel ===== */
    #side-pannel {
      background-color: #111827;
      width: 28%;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.4);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
    }

    .profile-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e1e1e, #3b3b3b);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 0 20px rgba(233, 30, 99, 0.4);
      overflow: hidden;
    }

    .profile-wrapper::before {
      content: "👤";
      font-size: 50px;
      color: rgba(255, 255, 255, 0.4);
      position: absolute;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .profile-img[src=""] {
      opacity: 0;
    }

    .nav ul {
      list-style: none;
      padding: 0;
      width: 100%;
    }

    .nav li {
      padding: 0.75rem 1rem;
      margin: 0.5rem 0;
      text-align: center;
      background-color: transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .nav li:hover, .nav li.active {
      background-color: #e91e63;
      color: white;
    }

    /* ===== Content Area ===== */
    #content-area {
      margin-left: 28%;
      flex: 1;
      padding: 3rem;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #content-area.show {
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      #side-pannel {
        position: relative;
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        height: auto;
      }
      #content-area {
        margin-left: 0;
        padding: 1.5rem;
      }
      .profile-wrapper { display: none; }
      .nav li { display: inline-block; margin: 0 0.5rem; }
    }
  </style>
</head>

<body>
  <!-- ===== SIDE PANEL ===== -->
  <div id="side-pannel">
    <div class="profile-wrapper">
      <img class="profile-img" src="" alt="Profile Image">
    </div>
    <hr class="text-white w-100">
    <div class="nav">
      <ul class="navbar-nav p-2">
        <li class="text-white active" data-page="about.html">About</li>
        <li class="text-white" data-page="projects.html">Projects</li>
        <li class="text-white" data-page="services.html">Services</li>
        <li class="text-white" data-page="contact.html">Contact</li>
      </ul>
    </div>
  </div>

  <!-- ===== CONTENT AREA ===== -->
  <div id="content-area">
    <h2 class="text-center mt-5">Loading...</h2>
  </div>

  <!-- ===== SCRIPT ===== -->
  <script>
    $(document).ready(function () {
      const $content = $("#content-area");

      // Load default page (About)
      loadPage("about.html");

      // Navigation click handler
      $(".nav li").on("click", function () {
        $(".nav li").removeClass("active");
        $(this).addClass("active");
        const page = $(this).data("page");
        loadPage(page);
      });

      // Function to load pages with fade transition
      function loadPage(page) {
        $content.removeClass("show");
        setTimeout(() => {
          $content.load(page, function (response, status) {
            if (status === "error") {
              $content.html(`<div class='text-center text-danger'><h3>⚠️ Failed to load ${page}</h3></div>`);
            }
            $content.addClass("show");
          });
        }, 300);
      }
    });
  </script>
</body>
</html>
