<h3 class="menu-type-title">{{ type }} Feast</h3>
<div class="menu-grid">
{% for item in items %}
    <div class="menu-card">
        <div class="menu-card-header">
            <h4>{{ item.name }}</h4>
            <span class="menu-price">₹{{ item.price }}</span>
        </div>
        <p class="menu-desc">{{ item.desc }}</p>
    </div>
{% endfor %}
</div>
